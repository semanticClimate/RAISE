[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
timeout = 120
addopts = -v --tb=short --import-mode=importlib -m "not destructive"
markers =
    operator: Developer and Database Operator subsystem checkups and telemetry
    api: FastAPI network routing, CORS, SSE, and frontend contract tests
    unit: Isolated business logic, math, table coordinates, and guardrail unit tests
    integration: Multi-substrate full pipeline integration tests
    cli: Developer studio console, arguments, REPL, and telemetry renderer tests
    security: Security guardrails, auth, and purge firewall tests
    e2e: End-to-end full pipeline and live container tests
    destructive: Tests that purge, delete, or reset databases (quarantined by default)
    slow: Long-running benchmarks or 100+ page OCR parsing tests
    benchmark: Automated benchmark suite evaluation tests

filterwarnings =
    ignore::DeprecationWarning:typer.*
    ignore::DeprecationWarning:click.*
    ignore:.*click\.utils\..*:DeprecationWarning
