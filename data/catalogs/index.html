    :root {
      --bg: #0f172a;

      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex: 1;
      height: 100%;
      position: relative;
    }
    #cy-container {
      flex: 1;
      height: 100%;
      position: relative;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }
    #cy {
      width: 100%;
      height: 100%;
    }
    #toolbar {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 10;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    #toolbar input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      width: 200px;
    }
    #toolbar select, #toolbar button {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    #toolbar button:hover, #toolbar select:hover {
      border-color: var(--accent);
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-machine { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
    .badge-stable { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    #drawer {
      width: 440px;
      height: 100%;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 25px rgba(0,0,0,0.4);
      z-index: 20;
    }
    #drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #drawer-header h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
    }
    #drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      font-size: 13px;
      line-height: 1.6;
    }
    #drawer-content pre {
      background: #0f172a;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 12px 0;
      border: 1px solid var(--border);
    }
    #drawer-content h1, #drawer-content h2, #drawer-content h3 {
      margin: 16px 0 8px 0;
      color: #e2e8f0;
    }
    #drawer-content ul {
      padding-left: 20px;
      margin-bottom: 12px;
    }
    .legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      gap: 12px;
      font-size: 12px;
      z-index: 10;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
