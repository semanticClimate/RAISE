[project]
name = "raise-pdf-parsing"
version = "0.1.0"
description = "Layout-aware PDF parsing and token-budget filtering for RAISE annual-report blocks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jsonschema>=4.22.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.scripts]
raise-pdf-parsing = "raise_pdf_parsing.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raise_pdf_parsing"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
