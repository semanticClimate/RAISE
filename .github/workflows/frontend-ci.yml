name: Frontend CI & Verification

on:
  push:
    branches:
      - frontend
      - main
      - Frontend
  pull_request:
    branches:
      - frontend
      - main
      - Frontend
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Build Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Biome Toolchain
        uses: biomejs/setup-biome@v2
        with:
          version: 'latest'

      - name: Initialize Biome Configuration
        run: |
          if [ ! -f biome.json ] && [ ! -f biome.jsonc ]; then
            printf '{"$schema":"https://biomejs.dev/schemas/2.6.6/schema.json","vcs":{"enabled":true,"clientKind":"git","useIgnoreFile":true},"files":{"ignoreUnknown":true,"includes":["src/**","biome.json","package.json","tsconfig.json","vite.config.ts"]},"formatter":{"enabled":false},"linter":{"enabled":true,"rules":{"preset":"none","correctness":{"preset":"recommended"},"suspicious":{"preset":"recommended","noExplicitAny":"off","noArrayIndexKey":"off","noAssignInExpressions":"off","noControlCharactersInRegex":"off"}}},"assist":{"enabled":false},"css":{"parser":{"tailwindDirectives":true}}}' > biome.json
          fi
          biome migrate --write || true

      - name: Run Biome Lint & Correctness Checks
        run: biome check --formatter-enabled=false src || biome lint src

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Typecheck & Compilation
        run: npm run typecheck

      - name: Build Application Bundle with Vite
        run: npm run build

      - name: Upload Build Artifacts
        if: (github.ref == 'refs/heads/frontend' || github.ref == 'refs/heads/Frontend' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    if: (github.ref == 'refs/heads/frontend' || github.ref == 'refs/heads/Frontend' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Setup GitHub Pages
        id: setup-pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy Pages Artifact
        id: deployment
        uses: actions/deploy-pages@v4
